<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · xxs→band (120)" viewport="700x300" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:24px 32px;display:flex;flex-direction:column;gap:9px;}
  .row{display:flex;align-items:center;gap:14px;}
  .tok{width:130px;flex:none;font-size:12px;color:var(--mute);}
  .tok b{color:var(--ink);}
  .bar{height:14px;background:var(--primary);border-radius:3px;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="tok"><b>xxs</b> · 4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok"><b>sm</b> · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok"><b>md</b> · 14</span><div class="bar" style="width:14px"></div></div>
  <div class="row"><span class="tok"><b>lg</b> · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok"><b>xl</b> · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok"><b>xxl</b> · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok"><b>xxxl</b> · 48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok"><b>block</b> · 80</span><div class="bar" style="width:80px"></div></div>
  <div class="row"><span class="tok"><b>section</b> · 88</span><div class="bar" style="width:88px"></div></div>
  <div class="row"><span class="tok"><b>band</b> · 120</span><div class="bar" style="width:120px"></div></div>
</div></body></html>
