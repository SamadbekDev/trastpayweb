<!DOCTYPE html>
<!-- @dsCard group="Components" name="Plan cards" subtitle="plan-card + featured (cobalt inversion)" viewport="700x250" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;font-family:var(--font-body);}
  .wrap{padding:26px 28px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{border-radius:var(--radius-lg);padding:24px;color:#fff;position:relative;}
  .plan{background:#16181a;}
  .feat{background:#1b2c7a;}
  .badge{position:absolute;top:18px;right:18px;background:#fff;color:#191c1f;font-size:11px;padding:3px 10px;border-radius:9999px;font-weight:600;}
  .name{font-family:var(--font-display);font-size:26px;font-weight:500;letter-spacing:-.3px;}
  .price{font-size:13px;color:var(--on-dark-mute);margin:6px 0 16px;}
  .feat .price{color:rgba(255,255,255,.85);}
  .li{font-size:13px;margin:8px 0;display:flex;gap:8px;align-items:center;}
  .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none;}
</style></head>
<body><div class="wrap">
  <div class="card plan">
    <div class="name">Standard</div>
    <div class="price">Free</div>
    <div class="li"><span class="dot"></span>Spend in 150+ currencies</div>
    <div class="li"><span class="dot"></span>Fee-free everyday banking</div>
  </div>
  <div class="card feat">
    <span class="badge">Most popular</span>
    <div class="name">Premium</div>
    <div class="price">£7.99 / month</div>
    <div class="li"><span class="dot"></span>Priority support</div>
    <div class="li"><span class="dot"></span>Higher limits &amp; perks</div>
  </div>
</div></body></html>
