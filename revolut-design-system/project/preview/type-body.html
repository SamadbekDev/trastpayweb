<!DOCTYPE html>
<!-- @dsCard group="Type" name="Body & caption" subtitle="Inter 400/600 · positive tracking" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);color:var(--ink);}
  .wrap{padding:24px 32px;}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--hairline-light);padding:11px 0;}
  .row:last-child{border-bottom:0;}
  .tok{font-family:var(--font-body);font-size:12px;color:var(--stone);width:130px;flex:none;}
  .specimen{flex:1;color:var(--body);}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="tok">body-lg · 18</span><span class="specimen t-body-lg">Marketing prose, calm and benefit-led.</span></div>
  <div class="row"><span class="tok">body-md · 16</span><span class="specimen t-body-md">Default body — Inter 400, +0.24 tracking.</span></div>
  <div class="row"><span class="tok">body-md-bold · 16</span><span class="specimen t-body-md-bold">Emphatic body — Inter 600.</span></div>
  <div class="row"><span class="tok">body-sm · 14</span><span class="specimen t-body-sm">Captions and metadata.</span></div>
  <div class="row"><span class="tok">caption · 13</span><span class="specimen t-caption" style="color:var(--ash);">Regulatory disclosure, footer fine print.</span></div>
</div></body></html>
