<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radius scale" subtitle="none→full · pills, lg cards, md inputs" viewport="700x175" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:26px 32px;display:flex;gap:18px;align-items:flex-end;}
  .item{text-align:center;}
  .box{width:78px;height:64px;background:var(--surface-soft);border:1px solid var(--hairline-light);}
  .n{font-size:11.5px;color:var(--mute);margin-top:8px;}
  .n b{display:block;color:var(--ink);font-size:12.5px;}
</style></head>
<body><div class="wrap">
  <div class="item"><div class="box" style="border-radius:0"></div><div class="n"><b>none</b>0</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="n"><b>sm</b>8</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="n"><b>md</b>12</div></div>
  <div class="item"><div class="box" style="border-radius:20px"></div><div class="n"><b>lg</b>20</div></div>
  <div class="item"><div class="box" style="border-radius:28px"></div><div class="n"><b>xl</b>28</div></div>
  <div class="item"><div class="box" style="border-radius:9999px"></div><div class="n"><b>full</b>pill</div></div>
</div></body></html>
