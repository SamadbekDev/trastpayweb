<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand color" subtitle="Cobalt violet — the single brand stamp" viewport="700x172" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:24px 32px;display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--hairline-light);}
  .chip{height:64px;}
  .meta{padding:10px 12px;}
  .name{font-size:13px;font-weight:600;color:var(--ink);}
  .hex{font-size:12px;color:var(--mute);margin-top:2px;}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#1b2c7a"></div><div class="meta"><div class="name">primary</div><div class="hex">#1b2c7a · dark blue</div></div></div>
  <div class="sw"><div class="chip" style="background:#27379a"></div><div class="meta"><div class="name">primary-bright</div><div class="hex">#27379a</div></div></div>
  <div class="sw"><div class="chip" style="background:#121d54"></div><div class="meta"><div class="name">primary-deep</div><div class="hex">#121d54 · pressed</div></div></div>
</div></body></html>
