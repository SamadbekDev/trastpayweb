<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Finance icons" subtitle="24px grid · 2px stroke · currentColor" viewport="700x215" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);}
  .wrap{padding:24px 30px;}
  .note{font-size:12px;color:var(--on-dark-mute);margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:18px 12px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .cell svg{width:26px;height:26px;}
  .cell span{font-size:9.5px;color:var(--on-dark-mute);}
</style><script src="../assets/icons-sprite.js"></script>
</head>
<body><div class="wrap">
  <div class="note">Finance glyphs — 24px grid, 2px stroke, currentColor (shown on accents).</div>
  <div class="grid">
    <div class="cell" style="color:#fff"><svg><use href="#icon-card"/></svg><span>card</span></div>
    <div class="cell" style="color:#00a87e"><svg><use href="#icon-wallet"/></svg><span>wallet</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-vault"/></svg><span>vault</span></div>
    <div class="cell" style="color:#428619"><svg><use href="#icon-savings"/></svg><span>savings</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-transfer"/></svg><span>transfer</span></div>
    <div class="cell" style="color:#007bc2"><svg><use href="#icon-exchange"/></svg><span>exchange</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-send"/></svg><span>send</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-request"/></svg><span>request</span></div>
    <div class="cell" style="color:#e61e49"><svg><use href="#icon-split"/></svg><span>split</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-tap"/></svg><span>tap</span></div>
    <div class="cell" style="color:#428619"><svg><use href="#icon-stocks"/></svg><span>stocks</span></div>
    <div class="cell" style="color:#ec7e00"><svg><use href="#icon-crypto"/></svg><span>crypto</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-chart"/></svg><span>chart</span></div>
    <div class="cell" style="color:#00a87e"><svg><use href="#icon-shield"/></svg><span>shield</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-globe"/></svg><span>globe</span></div>
    <div class="cell" style="color:#fff"><svg><use href="#icon-lock"/></svg><span>lock</span></div>
  </div>
</div></body></html>
