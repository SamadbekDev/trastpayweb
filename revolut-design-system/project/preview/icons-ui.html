<!DOCTYPE html>
<!-- @dsCard group="Brand" name="UI icons" subtitle="System & chrome glyphs" viewport="700x185" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);color:var(--ink);font-family:var(--font-body);}
  .wrap{padding:24px 30px;}
  .note{font-size:12px;color:var(--mute);margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:18px 10px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);}
  .cell svg{width:24px;height:24px;}
  .cell span{font-size:9px;color:var(--mute);}
</style><script src="../assets/icons-sprite.js"></script>
</head>
<body><div class="wrap">
  <div class="note">UI &amp; system glyphs — ink on light, on-dark on black.</div>
  <div class="grid">
    <div class="cell"><svg><use href="#icon-user"/></svg><span>user</span></div>
    <div class="cell"><svg><use href="#icon-bell"/></svg><span>bell</span></div>
    <div class="cell"><svg><use href="#icon-settings"/></svg><span>settings</span></div>
    <div class="cell"><svg><use href="#icon-qr"/></svg><span>qr</span></div>
    <div class="cell"><svg><use href="#icon-search"/></svg><span>search</span></div>
    <div class="cell"><svg><use href="#icon-plus"/></svg><span>plus</span></div>
    <div class="cell"><svg><use href="#icon-check"/></svg><span>check</span></div>
    <div class="cell"><svg><use href="#icon-close"/></svg><span>close</span></div>
    <div class="cell"><svg><use href="#icon-menu"/></svg><span>menu</span></div>
    <div class="cell"><svg><use href="#icon-arrow-up-right"/></svg><span>arrow</span></div>
    <div class="cell"><svg><use href="#icon-chevron-right"/></svg><span>chev-r</span></div>
    <div class="cell"><svg><use href="#icon-chevron-down"/></svg><span>chev-d</span></div>
  </div>
</div></body></html>
