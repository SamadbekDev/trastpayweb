<!DOCTYPE html>
<!-- @dsCard group="Components" name="Text input" subtitle="56px field · radius-md · cobalt focus" viewport="700x240" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);font-family:var(--font-body);color:var(--ink);}
  .wrap{padding:26px 32px;display:flex;flex-direction:column;gap:14px;max-width:420px;}
  label{font-size:13px;font-weight:600;}
  .field{height:56px;border:1px solid var(--hairline-light);border-radius:var(--radius-md);padding:0 16px;display:flex;align-items:center;font-size:16px;color:var(--ink);}
  .field.empty{color:var(--stone);}
  .field.focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(73,79,223,.15);}
  .hint{font-size:12px;color:var(--mute);}
</style></head>
<body><div class="wrap">
  <div><label>Email</label></div>
  <div class="field">you@revolut.com</div>
  <div class="field focus empty">Create a password</div>
  <div class="hint">text-input · 56px tall · radius-md (12px) · 1px hairline, cobalt focus ring.</div>
</div></body></html>
