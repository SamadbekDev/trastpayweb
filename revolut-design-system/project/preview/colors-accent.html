<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accent palette" subtitle="Illustration & icon only — never buttons" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:var(--font-body);}
  .wrap{padding:24px 32px;}
  .note{font-size:12px;color:var(--on-dark-mute);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sw{text-align:center;}
  .chip{height:46px;border-radius:var(--radius-sm);}
  .n{font-size:10.5px;margin-top:6px;color:var(--on-dark-mute);}
</style></head>
<body><div class="wrap">
  <div class="note">Accent palette — illustrations &amp; icons only, never button surfaces.</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#00a87e"></div><div class="n">teal</div></div>
    <div class="sw"><div class="chip" style="background:#007bc2"></div><div class="n">light-blue</div></div>
    <div class="sw"><div class="chip" style="background:#376cd5"></div><div class="n">blue-link</div></div>
    <div class="sw"><div class="chip" style="background:#428619"></div><div class="n">light-green</div></div>
    <div class="sw"><div class="chip" style="background:#b09000"></div><div class="n">yellow</div></div>
    <div class="sw"><div class="chip" style="background:#ec7e00"></div><div class="n">warning</div></div>
    <div class="sw"><div class="chip" style="background:#e61e49"></div><div class="n">pink</div></div>
    <div class="sw"><div class="chip" style="background:#e23b4a"></div><div class="n">danger</div></div>
    <div class="sw"><div class="chip" style="background:#8b0000"></div><div class="n">deep-red</div></div>
    <div class="sw"><div class="chip" style="background:#006400"></div><div class="n">green-text</div></div>
    <div class="sw"><div class="chip" style="background:#936d62"></div><div class="n">brown</div></div>
    <div class="sw"><div class="chip" style="background:#1b2c7a"></div><div class="n">primary</div></div>
  </div>
</div></body></html>
