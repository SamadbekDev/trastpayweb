<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & pills" subtitle="tag / feature badges · sub-nav pills" viewport="700x175" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--canvas-light);font-family:var(--font-body);color:var(--ink);}
  .wrap{padding:26px 32px;display:flex;flex-direction:column;gap:18px;}
  .group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .lab{font-size:11px;color:var(--stone);width:90px;flex:none;}
</style></head>
<body><div class="wrap">
  <div class="group"><span class="lab">badges</span>
    <span class="badge badge-tag">Fee-free</span>
    <span class="badge badge-tag">150+ currencies</span>
    <span class="badge badge-feature">New</span>
    <span class="badge badge-feature">Most popular</span>
  </div>
  <div class="group"><span class="lab">pills</span>
    <button class="btn btn-pill-sm" style="background:var(--ink);color:#fff">Personal</button>
    <button class="btn btn-pill-sm">Business</button>
    <button class="btn btn-pill-sm">Premium</button>
  </div>
</div></body></html>
